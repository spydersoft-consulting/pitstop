## Build Pipeline - Package & publish the combined pitstop OCI chart
## Triggered independently of pipeline-api.yml/pipeline-web.yml: the chart's
## own version is unrelated to either app's image tag, and neither of those
## pipelines is triggered by a chart-only change (they're path-scoped to
## src/api/* and src/web/* respectively).
resources:
  repositories:
    - repository: templates
      type: github
      endpoint: spydersoft-gh
      name: spydersoft-consulting/azure-devops-templates
    - repository: helmfileconfig
      type: github
      endpoint: spydersoft-gh
      name: spydersoft-consulting/pitstop-helm-config

trigger:
  tags:
    include:
    - "*"
  branches:
    include:
      - main
      - feature/*
  paths:
    include:
      - charts/pitstop/*

pr:
  branches:
    include:
      - main
  paths:
    include:
      - charts/pitstop/*

stages:
  - stage: Build
    jobs:
      - job: VersionJob
        pool:
          name: Default
        steps:
          - checkout: self
            fetchDepth: 0
            clean: true
            persistCredentials: true
          - task: gitversion/setup@3
            displayName: Setup GitVersion on Agent
            inputs:
              versionSpec: "6.0.x"
          - task: gitversion/execute@3
            displayName: Execute GitVersion to update build number

  # Same gating as pipeline-api.yml/pipeline-web.yml: a plain push to main
  # (no tag) or a PR only runs the Build stage above (GitVersion/sonar-style
  # validation); actual publish only happens for feature/* branches (-> test)
  # or tag builds (-> stage), consistent with process-cicd.ps1's environment
  # selection.
  - ${{ if not(or(eq(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranchName'], 'main'))) }}:
      - stage: chart_publish
        displayName: Publish Helm Chart
        dependsOn: Build
        jobs:
          - template: jobs/publish-helm-chart/v1.yml@templates
            parameters:
              chartName: pitstop
              chartPath: charts/pitstop
              chartVersion: $(build.buildnumber)
              containerRegistryName: github-spydersoft-docker

      - stage: updateHelmConfig
        displayName: Update Helm Config Repository
        dependsOn: chart_publish
        jobs:
          - job: updateHelmConfigJob
            pool:
              name: Default
            workspace:
              clean: all
            steps:
              - template: step_collections/process-cicd-script/v1.yml@templates
                parameters:
                  repositoryResource: helmfileconfig
                  branchName: $(Build.SourceBranch)
                  tagsCollection: chart_version=$(build.buildnumber)
                  commitMessage: Updated chart_version to $(build.buildnumber)
