defaultPodOptions:
  imagePullSecrets:
    - name: cr-spydersoft-github

controllers:
  main:
    enabled: false
  data-api:
    enabled: true
    type: deployment
    replicas: 1
    revisionHistoryLimit: 1
    containers:
      main:
        image:
          repository: ghcr.io/spydersoft-consulting/pitstop-data-api
          pullPolicy: IfNotPresent
          tag: latest
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /livez
                port: 8080
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /readyz
                port: 8080
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
  web:
    enabled: true
    type: deployment
    replicas: 1
    revisionHistoryLimit: 1
    containers:
      main:
        image:
          repository: ghcr.io/spydersoft-consulting/pitstop-web
          pullPolicy: IfNotPresent
          tag: latest
        # web's BFF reverse-proxies to data-api's Service within this same
        # release/namespace. Both controllers live in one release, so bjw-s
        # names the Service "<fullname>-data-api" -- computed here via the
        # same helper the chart itself uses, rather than hardcoded, so a
        # release rename can't silently break this like it did when
        # data-api moved out of its own standalone "data-api"-named release
        # (where the Service happened to collapse to a bare "data-api") and
        # into this combined chart.
        env:
          - name: OidcProxySettings__ReverseProxy__Clusters__pitstopApi__Destinations__destination1__Address
            value: 'http://{{ include "pitstop.fullname" . }}-data-api/'
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /livez
                port: 8080
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /readyz
                port: 8080
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3

service:
  main:
    enabled: false
  data-api:
    enabled: true
    controller: data-api
    nameOverride: data-api
    primary: true
    type: ClusterIP
    ports:
      http:
        enabled: true
        primary: true
        port: 80
        targetPort: 8080
  web:
    enabled: true
    controller: web
    nameOverride: web
    primary: true
    type: ClusterIP
    ports:
      http:
        enabled: true
        primary: true
        port: 80
        targetPort: 8080

route:
  main:
    enabled: false
  data-api:
    enabled: false
    kind: HTTPRoute
    parentRefs:
      - name: main
        namespace: envoy-gateway-system
        group: gateway.networking.k8s.io
        kind: Gateway
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - identifier: data-api
            port: 80
  web:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: main
        namespace: envoy-gateway-system
        group: gateway.networking.k8s.io
        kind: Gateway
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - identifier: web
            port: 80

env_name: dev
